[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peritoneal-dialysis-adequacy-engine"
version = "2.0.0"
description = "PD-Sentinel: Peritoneal Equilibration Test (PET) & Transport Status Classifier"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
peritoneal-dialysis-adequacy-agent = "peritoneal_dialysis_adequacy_agent.cli:main"
peritoneal-dialysis-adequacy-engine = "peritoneal_dialysis_adequacy_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/peritoneal-dialysis-adequacy-agent"
Repository = "https://github.com/abusuraihsakhri/peritoneal-dialysis-adequacy-agent.git"

[tool.setuptools.packages.find]
include = ["agents*", "peritoneal_dialysis_adequacy_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_pd_sentinel.py"]
