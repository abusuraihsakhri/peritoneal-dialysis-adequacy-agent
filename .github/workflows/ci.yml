name: CI — Python, browser and dependency checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Check Python dependencies and imports
        run: |
          python -m pip check
          python -m compileall -q agents peritoneal_dialysis_adequacy_agent
      - name: Python tests
        run: python -m pytest -q
      - name: Browser JavaScript syntax and calculations
        run: |
          node --check web/app.mjs
          node --check web/calculations.mjs
          node --test tests/web.test.mjs
      - name: Build distributable
        run: python -m build --wheel

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependency auditor
        run: python -m pip install -e ".[api,dev]" pip-audit
      - name: Audit installed Python packages
        run: python -m pip_audit
